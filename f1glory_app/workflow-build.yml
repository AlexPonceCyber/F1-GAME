name: Build apps
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci --omit=dev
      - run: node scripts/prepare.js
      - run: npx cap add android
      - run: node scripts/android-patch.js
      - run: npx cap sync android
      - run: chmod +x android/gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: F1Glory-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: node scripts/prepare.js
      - run: npx electron-builder --win --config electron-builder.config.js --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: F1Glory-windows
          path: dist/F1-Glory-Setup.exe
